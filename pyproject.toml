[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_nero_dual"
version = "0.2.0"
description = "LeRobot plugin for AgileX Nero dual-arm robot (7-DoF x2) and teleoperator (pyAgxArm backend)"
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    # 固定到已核对过接口的提交（含 NeroFW.V121）；升级前先对照 docs/nero/firmware_reference.md
    "pyAgxArm @ git+https://github.com/agilexrobotics/pyAgxArm@e7aef17d54cac80cbaeb1b4110ab3d8f1337a95b",
    "python-can>=3.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_robot_nero_dual*"]
